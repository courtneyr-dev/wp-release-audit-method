# Watch the third-party sources this repo adapts technique from.
#
# Release watch answers "did WordPress ship something." This answers the other
# standing question: "did the people we borrowed from learn something since."
# Borrowing once is a citation; borrowing and never looking again is how an
# attribution goes stale and a technique's limits shift under the write-up.
#
# The register is sources/upstream-watch.csv. Unlike release-watch, drift here is
# continuous rather than one-per-build, so this keeps ONE open issue and rewrites
# its body — a new issue every Monday would train everyone to close it unread.
#
# Injection note: the issue body contains third-party commit subjects, which are
# untrusted text. They reach the issue only through a file passed to --body-file
# and are never interpolated into a run: expression. Keep it that way — the day
# someone writes `gh issue create --body "$(...)"` here is the day an upstream
# commit message becomes a shell.

name: Upstream watch

on:
  schedule:
    # Weekly, Monday. Upstream tooling moves in bursts after incidents, not daily,
    # and an offset from self-test keeps the two from reporting in the same minute.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check watched upstreams for drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Controls first
        # A detector whose controls have not passed is not a reading. These run
        # offline against fixtures/upstream/, so a flaky network cannot quietly
        # turn the watch into a rubber stamp.
        run: python3 scripts/upstream-watch.py --control

      - name: Check for drift
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 scripts/upstream-watch.py --format=markdown > body.md || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "Every watched upstream is current." >> "$GITHUB_STEP_SUMMARY" ;;
            3) cat body.md >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::warning::No active rows in sources/upstream-watch.csv." ;;
            *) echo "::error::upstream-watch failed with exit $rc"; cat body.md; exit 1 ;;
          esac

      - name: Open or refresh the review issue
        if: steps.watch.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          gh label create upstream-watch \
            --description "An upstream this repo borrows from has moved" \
            --color 0E8A16 2>/dev/null || true

          {
            echo ""
            echo "---"
            echo ""
            echo "_Refreshed by [Upstream watch]($REPO_URL/actions/workflows/upstream-watch.yml)."
            echo "Close this issue once the baselines are moved and committed; the next run reopens"
            echo "a fresh one only when something new lands._"
          } >> body.md

          existing="$(gh issue list --state open --label upstream-watch --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Refreshed issue #$existing." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create \
              --title "Upstream watch: a source we borrow from has moved" \
              --label upstream-watch \
              --body-file body.md
            echo "Opened a new upstream-watch issue." >> "$GITHUB_STEP_SUMMARY"
          fi
