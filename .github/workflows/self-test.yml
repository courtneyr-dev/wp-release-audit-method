# This repository tests itself.
#
# A repository about testing that isn't tested is easy to dismiss — and the
# checks here are the ones that were previously run by hand, which is exactly
# the failure mode the rest of this repo warns about.

name: Self-test

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Weekly: catches external link rot without noise on every push.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install check dependencies
        run: |
          pip install --quiet pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run repository checks
        run: python3 scripts/check-repo.py

  external-links:
    name: External links
    runs-on: ubuntu-latest
    # Link rot is news, not a broken build — the same reasoning as the trunk
    # canary in the extension-author workflows.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check every external URL
        run: |
          grep -rhoE 'https://[^)"`<> ]+' --include='*.md' . \
            | sed 's/[.,:]$//' | sort -u > urls.txt
          echo "Checking $(wc -l < urls.txt) unique URLs"
          fail=0
          while read -r u; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 \
                   -A 'Mozilla/5.0 (compatible; wp-release-audit-method link check)' "$u" || echo 000)
            # 403/405 are bot-blocking and POST-only endpoints, not breakage.
            case "$code" in
              200|301|302|403|405) ;;
              *) echo "::warning::$code $u"; fail=$((fail+1)) ;;
            esac
          done < urls.txt
          echo "$fail non-OK URL(s)" >> "$GITHUB_STEP_SUMMARY"

  live-wordpress:
    name: Suite against live WordPress (DDEV)
    runs-on: ubuntu-latest
    # Until this job existed, CI checked syntax and never once booted WordPress —
    # a repository about testing whose own tests never ran the thing under test.
    # DDEV is the reference driver, so this is also the check that the driver
    # interface works somewhere other than the author's laptop.
    steps:
      - uses: actions/checkout@v4

      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Build an Act I fixture on the CURRENT stable
        run: |
          mkdir -p /tmp/fixture/.ddev
          cp fixtures/ddev/config.yaml /tmp/fixture/.ddev/config.yaml
          cd /tmp/fixture
          ddev start -y
          # Deliberately an OLDER release: a site installed fresh on the target
          # cannot test an upgrade, which is lie #2 in the README.
          ddev wp core download --version=6.7.2
          ddev wp core install --url="$(ddev exec -- sh -c 'echo $DDEV_PRIMARY_URL')" \
            --title='audit fixture' --admin_user=admin \
            --admin_password=password --admin_email=a@example.com
          ddev wp core version

      - name: Capabilities are declared, and honestly
        run: |
          cd "$GITHUB_WORKSPACE"
          . scripts/lib-env.sh
          env_init ddev /tmp/fixture
          env_caps_report | tee caps.txt
          # On Linux the mount is a real bind mount, so the host view is synchronous.
          grep -q 'hostfs' caps.txt || { echo "::error::no host filesystem capability"; exit 1; }
          # Over-claiming is the failure that corrupts results: DDEV is not SQLite.
          env_has sqlite && { echo "::error::driver over-claims sqlite"; exit 1; }
          env_has core-updater || { echo "::error::DDEV should reach the core updater"; exit 1; }

      - name: A cell needing a missing capability reports BLOCKED, not PASS
        run: |
          cd "$GITHUB_WORKSPACE"
          . scripts/lib-env.sh
          env_init ddev /tmp/fixture
          # `rc=0; x="$(cmd)" || rc=$?` and NOT `x="$(cmd)"; rc=$?` — Actions runs each
          # step under `bash -e`, so the plain assignment aborts the step on exactly the
          # non-zero status this test exists to observe.
          rc=0
          out="$(env_require T1-44 sqlite)" || rc=$?
          echo "$out"
          [ "$rc" = "2" ] || { echo "::error::env_require returned $rc, expected 2"; exit 1; }
          echo "$out" | grep -q 'BLOCKED  T1-44' || { echo "::error::no BLOCKED verdict"; exit 1; }
          echo "$out" | grep -q 'sqlite'         || { echo "::error::missing cap not named"; exit 1; }

      - name: Run the CRUD suite for real
        run: bash scripts/crud-suite.sh --env=ddev /tmp/fixture | tee crud.txt

      - name: Assert the suite actually exercised WordPress
        run: |
          fail=0
          grep -q 'driver=ddev'            crud.txt || { echo "::error::driver not reported"; fail=1; }
          grep -q 'final_fatal_scan=0'     crud.txt || { echo "::error::fatals on the front end"; fail=1; }
          grep -q 'after_force_delete exists=gone' crud.txt || { echo "::error::post delete did not take"; fail=1; }
          grep -q 'cpt registered=1'       crud.txt || { echo "::error::CPT cell did not run"; fail=1; }
          exit $fail

      - name: Upgrade to a newer core and diff the file tree from the host
        run: |
          cd "$GITHUB_WORKSPACE"
          . scripts/lib-env.sh
          env_init ddev /tmp/fixture
          env_tree before.txt
          env_core_install 6.9
          env_tree after.txt
          # Two consecutive reads must agree, or the host view is stale and every
          # file-integrity finding taken through it is a harness fault, not a result.
          env_tree after2.txt
          cmp -s after.txt after2.txt || { echo "::error::host file view is unstable"; exit 1; }
          echo "changed paths: $(comm -3 before.txt after.txt | wc -l)"
          comm -3 before.txt after.txt | head -20

      - name: Snapshot round-trip
        run: |
          cd "$GITHUB_WORKSPACE"
          . scripts/lib-env.sh
          env_init ddev /tmp/fixture
          if env_has snapshot; then
            env_wp post create --post_title=SNAPMARKER --post_status=publish
            before="$(env_wp post list --post_status=publish --format=count)"
            env_db_snapshot ci-fx
            env_wp post delete "$(env_wp post list --title=SNAPMARKER --field=ID | head -1)" --force
            env_db_restore ci-fx
            after="$(env_wp post list --post_status=publish --format=count)"
            echo "before=$before after=$after"
            [ "$before" = "$after" ] || { echo "::error::snapshot did not round-trip"; exit 1; }
          else
            echo "snapshot capability not declared here — skipping, and that is the point"
          fi

      - name: Tear down
        if: always()
        run: cd /tmp/fixture && ddev delete -O -y || true

  surface-inventory:
    name: Tool smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The inventory tool ships as a deliverable, so prove it runs and produces
      # the sections it claims to — against a fixture built here, not a real plugin.
      - name: Build a fixture extension
        run: |
          mkdir -p /tmp/fx/templates /tmp/fx/parts
          printf '/*\nTheme Name: Fixture\n*/\n' > /tmp/fx/style.css
          printf '{"version":2,"settings":{"color":{}}}\n' > /tmp/fx/theme.json
          printf '<!-- wp:site-title /-->\n' > /tmp/fx/templates/index.html
          cat > /tmp/fx/functions.php <<'PHP'
          <?php
          add_action( 'init', 'fx_init' );
          add_filter( 'the_content', 'fx_content' );
          add_theme_support( 'editor-color-palette', array() );
          add_meta_box( 'fx_box', 'Box', 'fx_render' );
          current_user_can( 'manage_options' );
          get_option( 'fx_settings' );
          $x = get_page_by_title( 'About' );
          wp_enqueue_script( 'jquery' );
          PHP

      - name: Run the inventory tool
        run: bash scripts/wp-surface-inventory.sh /tmp/fx | tee out.txt

      - name: Assert it produced the sections it documents
        run: |
          fail=0
          for section in "CORE HOOKS CONSUMED" "CAPABILITIES AND ROLES" "PERSISTENCE" \
                         "DEPRECATION RISK" "CLASSIC EDITOR SURFACES" "BLOCK EDITOR SURFACES" \
                         "ACCESSIBILITY SURFACES" "ADOPTION CANDIDATES" "THEME TYPE"; do
            grep -q "$section" out.txt || { echo "::error::missing section: $section"; fail=1; }
          done
          # It must annotate a known deprecation with version and replacement.
          grep -q "get_page_by_title.*6.2.*WP_Query" out.txt \
            || { echo "::error::deprecation annotation missing"; fail=1; }
          exit $fail

      - name: CSV mode parses, and --baseline diffs
        run: |
          bash scripts/wp-surface-inventory.sh /tmp/fx --csv > a.csv
          python3 -c "
          import csv,sys
          rows=list(csv.reader(open('a.csv')))
          assert rows[0]==['surface','item','count'], rows[0]
          assert len(rows)>10, f'only {len(rows)} rows'
          print(f'{len(rows)-1} surface rows')
          "
          echo "add_action( 'save_post', 'fx_save' );" >> /tmp/fx/functions.php
          bash scripts/wp-surface-inventory.sh /tmp/fx --baseline a.csv | tee diff.txt
          grep -q "save_post" diff.txt || { echo "::error::baseline diff did not detect the new hook"; exit 1; }
